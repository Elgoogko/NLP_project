[project]
name = "nlp-project"
version = "0.1.0"
requires-python = ">=3.11, <3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "gradio>=6.28.0",
    "huggingface>=0.0.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "peft>=0.21.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "torch",
    "transformers>=5.17.0",
    "trl>=1.14.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
